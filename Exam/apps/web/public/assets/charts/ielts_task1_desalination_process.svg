<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="roGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="brineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="freshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Title & Banner -->
  <rect x="25" y="20" width="950" height="58" rx="8" fill="url(#headerGrad)" opacity="0.12" />
  <rect x="25" y="20" width="950" height="58" rx="8" fill="none" stroke="#0284c7" stroke-width="1" />
  <text x="50" y="45" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">IELTS Academic Task 1: Seawater Reverse Osmosis (SWRO) Desalination Process</text>
  <text x="50" y="65" fill="#94a3b8" font-size="12">Multi-stage technical flow diagram from deep-sea intake to municipal potable water distribution</text>

  <!-- STAGE 1: INTAKE & SEA -->
  <g transform="translate(35, 110)">
    <!-- Sea water box -->
    <rect x="0" y="50" width="130" height="240" rx="10" fill="url(#oceanGrad)" stroke="#0369a1" stroke-width="1.5" />
    <!-- Wave lines -->
    <path d="M 10 70 Q 30 60, 50 70 T 90 70 T 120 70" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
    <path d="M 10 90 Q 30 80, 50 90 T 90 90 T 120 90" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
    <text x="65" y="130" fill="#e0f2fe" font-size="14" font-weight="700" text-anchor="middle">Open Ocean</text>
    <text x="65" y="150" fill="#bae6fd" font-size="11" text-anchor="middle">(Salinity ~35,000 ppm)</text>

    <!-- Submerged intake pipe -->
    <rect x="80" y="200" width="60" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Coarse mesh screen -->
    <line x1="83" y1="200" x2="83" y2="222" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2,2" />
    <text x="65" y="245" fill="#94a3b8" font-size="10" text-anchor="middle">Submerged Intake</text>
    <text x="65" y="258" fill="#f59e0b" font-size="9" text-anchor="middle">(Coarse Screen)</text>

    <!-- Step number badge -->
    <circle cx="20" cy="20" r="14" fill="#0284c7" />
    <text x="20" y="25" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1</text>
    <text x="42" y="24" fill="#38bdf8" font-size="12" font-weight="600">Ocean Intake</text>
  </g>

  <!-- FLOW ARROW 1 -> 2 -->
  <path d="M 175 320 L 210 320" fill="none" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrowCyan)" />
  <text x="192" y="310" fill="#38bdf8" font-size="9" text-anchor="middle">Raw Feed</text>

  <!-- STAGE 2: PRE-TREATMENT & FILTRATION -->
  <g transform="translate(215, 110)">
    <!-- Stage box -->
    <rect x="0" y="50" width="145" height="240" rx="10" fill="url(#tankGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />

    <!-- Chemical Dosing tank -->
    <rect x="15" y="65" width="115" height="40" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1" />
    <text x="72" y="82" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Chemical Coagulation</text>
    <text x="72" y="96" fill="#94a3b8" font-size="9" text-anchor="middle">&amp; Flocculation</text>

    <!-- Down arrow inside -->
    <path d="M 72 108 L 72 120" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)" />

    <!-- Dual Media Filter -->
    <rect x="15" y="125" width="115" height="85" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <!-- Filter layers -->
    <rect x="18" y="128" width="109" height="24" fill="#334155" opacity="0.8" />
    <text x="72" y="144" fill="#cbd5e1" font-size="9" text-anchor="middle">Anthracite Layer</text>
    <rect x="18" y="154" width="109" height="24" fill="#64748b" opacity="0.6" />
    <text x="72" y="170" fill="#cbd5e1" font-size="9" text-anchor="middle">Silica Sand Layer</text>
    <rect x="18" y="180" width="109" height="26" fill="#475569" opacity="0.4" />
    <text x="72" y="196" fill="#cbd5e1" font-size="9" text-anchor="middle">Gravel Support</text>

    <!-- Cartridge fine filter -->
    <rect x="25" y="230" width="95" height="35" rx="4" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
    <text x="72" y="246" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">5μm Cartridge Filter</text>
    <text x="72" y="258" fill="#94a3b8" font-size="8" text-anchor="middle">Suspended Solids Removed</text>

    <!-- Step number badge -->
    <circle cx="20" cy="20" r="14" fill="#0284c7" />
    <text x="20" y="25" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2</text>
    <text x="42" y="24" fill="#38bdf8" font-size="12" font-weight="600">Pre-Treatment</text>
  </g>

  <!-- FLOW ARROW 2 -> 3 -->
  <path d="M 360 355 L 400 355" fill="none" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrowCyan)" />
  <text x="380" y="347" fill="#38bdf8" font-size="9" text-anchor="middle">Filtered</text>

  <!-- STAGE 3: HIGH-PRESSURE PUMP & ENERGY RECOVERY -->
  <g transform="translate(405, 110)">
    <rect x="0" y="50" width="130" height="240" rx="10" fill="url(#tankGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />

    <!-- Pump symbol -->
    <circle cx="65" cy="130" r="38" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />
    <!-- Impeller Blades -->
    <path d="M 65 100 L 65 160 M 35 130 L 95 130 M 44 109 L 86 151 M 44 151 L 86 109" stroke="#f59e0b" stroke-width="2" />
    <circle cx="65" cy="130" r="10" fill="#f59e0b" />

    <text x="65" y="190" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">High-Pressure</text>
    <text x="65" y="205" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Booster Pump</text>
    <rect x="15" y="215" width="100" height="20" rx="4" fill="#f59e0b" opacity="0.2" />
    <text x="65" y="229" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">60 - 80 Bar</text>

    <!-- Energy Recovery Device -->
    <rect x="15" y="245" width="100" height="32" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="65" y="259" fill="#a7f3d0" font-size="9" font-weight="600" text-anchor="middle">Energy Recovery</text>
    <text x="65" y="271" fill="#6ee7b7" font-size="8" text-anchor="middle">(Pressure Exchanger)</text>

    <!-- Step number badge -->
    <circle cx="20" cy="20" r="14" fill="#0284c7" />
    <text x="20" y="25" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">3</text>
    <text x="42" y="24" fill="#38bdf8" font-size="12" font-weight="600">Pressurization</text>
  </g>

  <!-- FLOW ARROW 3 -> 4 -->
  <path d="M 535 240 L 575 240" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowCyan)" />
  <text x="555" y="232" fill="#f59e0b" font-size="9" text-anchor="middle">High P</text>

  <!-- STAGE 4: REVERSE OSMOSIS VESSEL -->
  <g transform="translate(580, 110)">
    <rect x="0" y="50" width="155" height="240" rx="10" fill="url(#tankGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />

    <!-- RO Pressure Vessels (Stacked cylinders) -->
    <!-- Vessel 1 -->
    <rect x="15" y="70" width="125" height="42" rx="6" fill="#0f172a" stroke="url(#roGrad)" stroke-width="2" />
    <line x1="75" y1="70" x2="75" y2="112" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
    <text x="45" y="95" fill="#93c5fd" font-size="10" font-weight="600" text-anchor="middle">Saline Feed</text>
    <text x="105" y="95" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">Permeate</text>

    <!-- Vessel 2 -->
    <rect x="15" y="125" width="125" height="42" rx="6" fill="#0f172a" stroke="url(#roGrad)" stroke-width="2" />
    <line x1="75" y1="125" x2="75" y2="167" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
    <text x="45" y="150" fill="#93c5fd" font-size="10" font-weight="600" text-anchor="middle">Saline Feed</text>
    <text x="105" y="150" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">Permeate</text>

    <!-- Semi-permeable membrane callout -->
    <rect x="12" y="180" width="131" height="48" rx="4" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
    <text x="77" y="196" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Polyamide Membrane</text>
    <text x="77" y="210" fill="#cbd5e1" font-size="8.5" text-anchor="middle">Pore Size ~0.1 nm</text>
    <text x="77" y="221" fill="#94a3b8" font-size="8" text-anchor="middle">(Blocks 99.4% Salts &amp; Minerals)</text>

    <!-- Split labels -->
    <text x="77" y="255" fill="#f87171" font-size="10" font-weight="700" text-anchor="middle">▼ Brine Stream (55%)</text>
    <text x="77" y="275" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">▶ Permeate Water (45%)</text>

    <!-- Step number badge -->
    <circle cx="20" cy="20" r="14" fill="#0284c7" />
    <text x="20" y="25" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">4</text>
    <text x="42" y="24" fill="#38bdf8" font-size="12" font-weight="600">Reverse Osmosis</text>
  </g>

  <!-- SPLIT STREAM PATHS -->
  <!-- Stream 1: Permeate (Freshwater) to Stage 5 -->
  <path d="M 735 230 L 775 230" fill="none" stroke="#10b981" stroke-width="3.5" marker-end="url(#arrowGreen)" />
  <text x="755" y="222" fill="#10b981" font-size="9" font-weight="600" text-anchor="middle">Fresh Water</text>

  <!-- Stream 2: Hypersaline Brine Discharge loop (Downwards and back to ocean) -->
  <path d="M 655 350 L 655 460 L 100 460 L 100 375" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowRed)" />
  <rect x="320" y="445" width="220" height="28" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
  <text x="430" y="463" fill="#fca5a5" font-size="11" font-weight="600" text-anchor="middle">Hypersaline Brine (~70,000 ppm) Discharge</text>
  <text x="100" y="405" fill="#ef4444" font-size="9" font-weight="bold" text-anchor="middle">Deep Sea Diffuser</text>

  <!-- STAGE 5: POST-TREATMENT & REMINERALISATION -->
  <g transform="translate(780, 110)">
    <rect x="0" y="50" width="180" height="150" rx="10" fill="url(#tankGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />

    <text x="90" y="75" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Remineralisation</text>
    <text x="90" y="90" fill="#94a3b8" font-size="10" text-anchor="middle">&amp; Disinfection</text>

    <!-- Mineral Dosing items -->
    <rect x="15" y="105" width="70" height="34" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="50" y="120" fill="#a7f3d0" font-size="9" font-weight="600" text-anchor="middle">+ Lime &amp; CO2</text>
    <text x="50" y="132" fill="#6ee7b7" font-size="8" text-anchor="middle">(pH Balance)</text>

    <rect x="95" y="105" width="70" height="34" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
    <text x="130" y="120" fill="#bae6fd" font-size="9" font-weight="600" text-anchor="middle">+ Chlorine / UV</text>
    <text x="130" y="132" fill="#7dd3fc" font-size="8" text-anchor="middle">(Disinfection)</text>

    <text x="90" y="165" fill="#e2e8f0" font-size="10" text-anchor="middle">Fluoridation &amp; Stabilization</text>
    <text x="90" y="180" fill="#10b981" font-size="9" font-weight="600" text-anchor="middle">WHO Potable Standard Met</text>

    <!-- Step number badge -->
    <circle cx="20" cy="20" r="14" fill="#0284c7" />
    <text x="20" y="25" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">5</text>
    <text x="42" y="24" fill="#38bdf8" font-size="12" font-weight="600">Post-Treatment</text>
  </g>

  <!-- FLOW ARROW 5 -> 6 -->
  <path d="M 870 260 L 870 310" fill="none" stroke="#10b981" stroke-width="3.5" marker-end="url(#arrowGreen)" />
  <text x="885" y="290" fill="#10b981" font-size="9" font-weight="600">Potable Water</text>

  <!-- STAGE 6: STORAGE & MUNICIPAL DISTRIBUTION -->
  <g transform="translate(750, 320)">
    <rect x="0" y="30" width="220" height="150" rx="10" fill="url(#tankGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />

    <!-- Storage Silo -->
    <rect x="15" y="45" width="80" height="70" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <text x="55" y="80" fill="#e0f2fe" font-size="11" font-weight="700" text-anchor="middle">Treated</text>
    <text x="55" y="95" fill="#e0f2fe" font-size="11" font-weight="700" text-anchor="middle">Reservoir</text>

    <!-- Pipe to City -->
    <path d="M 95 80 L 125 80" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)" />

    <!-- City / Houses Icons -->
    <rect x="125" y="45" width="80" height="70" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <!-- City Roofs -->
    <polygon points="140,75 150,60 160,75" fill="#38bdf8" />
    <rect x="143" y="75" width="14" height="20" fill="#1e293b" />
    <polygon points="165,70 180,52 195,70" fill="#06b6d4" />
    <rect x="168" y="70" width="24" height="25" fill="#1e293b" />

    <text x="165" y="106" fill="#e2e8f0" font-size="9" font-weight="600" text-anchor="middle">Urban Network</text>

    <rect x="15" y="130" width="190" height="35" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="110" y="145" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">Municipal Domestic &amp; Industrial Supply</text>
    <text x="110" y="157" fill="#6ee7b7" font-size="8.5" text-anchor="middle">Piped to Homes, Hospitals, Commercial Sectors</text>

    <!-- Step number badge -->
    <circle cx="20" cy="15" r="14" fill="#0284c7" />
    <text x="20" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">6</text>
    <text x="42" y="19" fill="#38bdf8" font-size="12" font-weight="600">Distribution</text>
  </g>

  <!-- LEGEND & METRICS BAR -->
  <g transform="translate(35, 525)">
    <rect x="0" y="0" width="930" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />

    <text x="20" y="24" fill="#f8fafc" font-size="12" font-weight="700">TECHNICAL PROCESS OVERVIEW &amp; KEY DATA POINTS FOR CANDIDATES:</text>

    <circle cx="25" cy="48" r="6" fill="#06b6d4" />
    <text x="38" y="52" fill="#cbd5e1" font-size="11">Raw Seawater Feed (~3.5% TDS)</text>

    <circle cx="230" cy="48" r="6" fill="#f59e0b" />
    <text x="243" y="52" fill="#cbd5e1" font-size="11">Operating Pressure (60 - 80 Bar)</text>

    <circle cx="450" cy="48" r="6" fill="#10b981" />
    <text x="463" y="52" fill="#cbd5e1" font-size="11">Recovery Ratio: 40% - 45% Permeate</text>

    <circle cx="700" cy="48" r="6" fill="#ef4444" />
    <text x="713" y="52" fill="#cbd5e1" font-size="11">Brine Reject: 55% - 60% @ 70k ppm</text>
  </g>
</svg>

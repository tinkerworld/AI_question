<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Title & Subtitle -->
  <text x="400" y="38" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Renewable Electricity Generation by Source in Five European Nations (2010 vs 2024)</text>
  <text x="400" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">Percentage share of total domestic electricity production (%)</text>

  <!-- Legend -->
  <g transform="translate(180, 80)">
    <!-- Hydroelectric -->
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#3b82f6" />
    <text x="24" y="13" fill="#e2e8f0" font-size="12" font-weight="600">Hydroelectric</text>

    <!-- Wind -->
    <rect x="160" y="0" width="16" height="16" rx="3" fill="#10b981" />
    <text x="184" y="13" fill="#e2e8f0" font-size="12" font-weight="600">Wind Energy</text>

    <!-- Solar -->
    <rect x="300" y="0" width="16" height="16" rx="3" fill="#f59e0b" />
    <text x="324" y="13" fill="#e2e8f0" font-size="12" font-weight="600">Solar PV</text>
  </g>

  <!-- Y-Axis Gridlines & Labels -->
  <g stroke="#334155" stroke-dasharray="4,4" stroke-width="1">
    <line x1="80" y1="130" x2="740" y2="130" />
    <line x1="80" y1="185" x2="740" y2="185" />
    <line x1="80" y1="240" x2="740" y2="240" />
    <line x1="80" y1="295" x2="740" y2="295" />
    <line x1="80" y1="350" x2="740" y2="350" />
  </g>
  <line x1="80" y1="405" x2="740" y2="405" stroke="#64748b" stroke-width="2" />

  <!-- Y-Axis Labels -->
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="70" y="134">100%</text>
    <text x="70" y="189">75%</text>
    <text x="70" y="244">50%</text>
    <text x="70" y="299">25%</text>
    <text x="70" y="354">10%</text>
    <text x="70" y="409">0%</text>
  </g>

  <!-- Country 1: Norway (High Hydro) -->
  <g transform="translate(100, 0)">
    <!-- 2010 Group -->
    <rect x="0" y="142" width="22" height="263" rx="2" fill="#3b82f6" opacity="0.8" />
    <rect x="24" y="385" width="22" height="20" rx="2" fill="#10b981" opacity="0.8" />
    <rect x="48" y="403" width="22" height="2" rx="2" fill="#f59e0b" opacity="0.8" />

    <!-- 2024 Group -->
    <rect x="76" y="152" width="22" height="253" rx="2" fill="#3b82f6" />
    <rect x="100" y="325" width="22" height="80" rx="2" fill="#10b981" />
    <rect x="124" y="395" width="22" height="10" rx="2" fill="#f59e0b" />

    <text x="36" y="424" fill="#94a3b8" font-size="10" text-anchor="middle">'10</text>
    <text x="112" y="424" fill="#94a3b8" font-size="10" text-anchor="middle">'24</text>
    <text x="74" y="445" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="middle">Norway</text>
  </g>

  <!-- Country 2: Denmark (High Wind) -->
  <g transform="translate(235, 0)">
    <!-- 2010 Group -->
    <rect x="0" y="403" width="22" height="2" rx="2" fill="#3b82f6" opacity="0.8" />
    <rect x="24" y="320" width="22" height="85" rx="2" fill="#10b981" opacity="0.8" />
    <rect x="48" y="401" width="22" height="4" rx="2" fill="#f59e0b" opacity="0.8" />

    <!-- 2024 Group -->
    <rect x="76" y="403" width="22" height="2" rx="2" fill="#3b82f6" />
    <rect x="100" y="215" width="22" height="190" rx="2" fill="#10b981" />
    <rect x="124" y="350" width="22" height="55" rx="2" fill="#f59e0b" />

    <text x="36" y="424" fill="#94a3b8" font-size="10" text-anchor="middle">'10</text>
    <text x="112" y="424" fill="#94a3b8" font-size="10" text-anchor="middle">'24</text>
    <text x="74" y="445" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="middle">Denmark</text>
  </g>

  <!-- Country 3: Spain (Balanced Solar & Wind) -->
  <g transform="translate(370, 0)">
    <!-- 2010 Group -->
    <rect x="0" y="355" width="22" height="50" rx="2" fill="#3b82f6" opacity="0.8" />
    <rect x="24" y="340" width="22" height="65" rx="2" fill="#10b981" opacity="0.8" />
    <rect x="48" y="388" width="22" height="17" rx="2" fill="#f59e0b" opacity="0.8" />

    <!-- 2024 Group -->
    <rect x="76" y="360" width="22" height="45" rx="2" fill="#3b82f6" />
    <rect x="100" y="275" width="22" height="130" rx="2" fill="#10b981" />
    <rect x="124" y="260" width="22" height="145" rx="2" fill="#f59e0b" />

    <text x="36" y="424" fill="#94a3b8" font-size="10" text-anchor="middle">'10</text>
    <text x="112" y="424" fill="#94a3b8" font-size="10" text-anchor="middle">'24</text>
    <text x="74" y="445" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="middle">Spain</text>
  </g>

  <!-- Country 4: Germany (Solar & Wind Growth) -->
  <g transform="translate(505, 0)">
    <!-- 2010 Group -->
    <rect x="0" y="380" width="22" height="25" rx="2" fill="#3b82f6" opacity="0.8" />
    <rect x="24" y="365" width="22" height="40" rx="2" fill="#10b981" opacity="0.8" />
    <rect x="48" y="375" width="22" height="30" rx="2" fill="#f59e0b" opacity="0.8" />

    <!-- 2024 Group -->
    <rect x="76" y="382" width="22" height="23" rx="2" fill="#3b82f6" />
    <rect x="100" y="240" width="22" height="165" rx="2" fill="#10b981" />
    <rect x="124" y="275" width="22" height="130" rx="2" fill="#f59e0b" />

    <text x="36" y="424" fill="#94a3b8" font-size="10" text-anchor="middle">'10</text>
    <text x="112" y="424" fill="#94a3b8" font-size="10" text-anchor="middle">'24</text>
    <text x="74" y="445" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="middle">Germany</text>
  </g>

  <!-- Country 5: United Kingdom (Offshore Wind Growth) -->
  <g transform="translate(640, 0)">
    <!-- 2010 Group -->
    <rect x="0" y="395" width="22" height="10" rx="2" fill="#3b82f6" opacity="0.8" />
    <rect x="24" y="378" width="22" height="27" rx="2" fill="#10b981" opacity="0.8" />
    <rect x="48" y="403" width="22" height="2" rx="2" fill="#f59e0b" opacity="0.8" />

    <!-- 2024 Group -->
    <rect x="76" y="392" width="22" height="13" rx="2" fill="#3b82f6" />
    <rect x="100" y="235" width="22" height="170" rx="2" fill="#10b981" />
    <rect x="124" y="365" width="22" height="40" rx="2" fill="#f59e0b" />

    <text x="36" y="424" fill="#94a3b8" font-size="10" text-anchor="middle">'10</text>
    <text x="112" y="424" fill="#94a3b8" font-size="10" text-anchor="middle">'24</text>
    <text x="74" y="445" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="middle">United Kingdom</text>
  </g>

  <!-- Footnote -->
  <text x="80" y="470" fill="#64748b" font-size="11" font-style="italic">Source: Eurostat European Energy Directorate (2010-2024 Statistical Bulletin). Solid: 2024, Light: 2010.</text>
</svg>

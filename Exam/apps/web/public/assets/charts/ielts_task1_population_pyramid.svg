<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Title & Subtitle -->
  <text x="420" y="38" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Demographic Population Pyramid: Age Cohorts &amp; Gender (1970 vs 2024)</text>
  <text x="420" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">Proportion of total national population across demographic age cohorts (%)</text>

  <!-- Legend -->
  <g transform="translate(320, 80)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#06b6d4" />
    <text x="24" y="13" fill="#e2e8f0" font-size="12" font-weight="600">Male</text>

    <rect x="110" y="0" width="16" height="16" rx="3" fill="#c084fc" />
    <text x="134" y="13" fill="#e2e8f0" font-size="12" font-weight="600">Female</text>
  </g>

  <!-- ==================== LEFT PYRAMID: 1970 ==================== -->
  <g transform="translate(40, 110)">
    <!-- Subheading -->
    <rect x="0" y="0" width="360" height="28" rx="4" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.3)" />
    <text x="180" y="19" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">Year 1970 (Total Population: 42.5M)</text>

    <!-- Center Line & Gridlines -->
    <line x1="180" y1="40" x2="180" y2="340" stroke="#475569" stroke-width="2" />
    <g stroke="#334155" stroke-dasharray="3,3" stroke-width="1">
      <line x1="30" y1="40" x2="30" y2="340" />
      <line x1="80" y1="40" x2="80" y2="340" />
      <line x1="130" y1="40" x2="130" y2="340" />
      <line x1="230" y1="40" x2="230" y2="340" />
      <line x1="280" y1="40" x2="280" y2="340" />
      <line x1="330" y1="40" x2="330" y2="340" />
    </g>

    <!-- X-Axis Labels (Percentages) -->
    <g fill="#94a3b8" font-size="10" text-anchor="middle">
      <text x="30" y="356">15%</text>
      <text x="80" y="356">10%</text>
      <text x="130" y="356">5%</text>
      <text x="180" y="356">0%</text>
      <text x="230" y="356">5%</text>
      <text x="280" y="356">10%</text>
      <text x="330" y="356">15%</text>
      <text x="180" y="372" fill="#cbd5e1" font-weight="600">Male ◄ | ► Female</text>
    </g>

    <!-- Cohort 1: 75+ years (1970: Male 1.5%, Female 2.5%) -->
    <rect x="165" y="55" width="15" height="32" rx="2" fill="#06b6d4" />
    <rect x="180" y="55" width="25" height="32" rx="2" fill="#c084fc" />
    <text x="180" y="76" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">75+ yrs</text>
    <text x="150" y="75" fill="#38bdf8" font-size="10">1.5%</text>
    <text x="215" y="75" fill="#e9d5ff" font-size="10">2.5%</text>

    <!-- Cohort 2: 60-74 years (1970: Male 4.5%, Female 6.0%) -->
    <rect x="135" y="100" width="45" height="32" rx="2" fill="#06b6d4" />
    <rect x="180" y="100" width="60" height="32" rx="2" fill="#c084fc" />
    <text x="180" y="121" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">60–74</text>
    <text x="118" y="120" fill="#38bdf8" font-size="10">4.5%</text>
    <text x="248" y="120" fill="#e9d5ff" font-size="10">6.0%</text>

    <!-- Cohort 3: 45-59 years (1970: Male 8.5%, Female 9.0%) -->
    <rect x="95" y="145" width="85" height="32" rx="2" fill="#06b6d4" />
    <rect x="180" y="145" width="90" height="32" rx="2" fill="#c084fc" />
    <text x="180" y="166" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">45–59</text>
    <text x="75" y="165" fill="#38bdf8" font-size="10">8.5%</text>
    <text x="278" y="165" fill="#e9d5ff" font-size="10">9.0%</text>

    <!-- Cohort 4: 30-44 years (1970: Male 10.5%, Female 10.5%) -->
    <rect x="75" y="190" width="105" height="32" rx="2" fill="#06b6d4" />
    <rect x="180" y="190" width="105" height="32" rx="2" fill="#c084fc" />
    <text x="180" y="211" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">30–44</text>
    <text x="52" y="210" fill="#38bdf8" font-size="10">10.5%</text>
    <text x="295" y="210" fill="#e9d5ff" font-size="10">10.5%</text>

    <!-- Cohort 5: 15-29 years (1970: Male 12.0%, Female 11.5%) -->
    <rect x="60" y="235" width="120" height="32" rx="2" fill="#06b6d4" />
    <rect x="180" y="235" width="115" height="32" rx="2" fill="#c084fc" />
    <text x="180" y="256" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">15–29</text>
    <text x="35" y="255" fill="#38bdf8" font-size="10">12.0%</text>
    <text x="305" y="255" fill="#e9d5ff" font-size="10">11.5%</text>

    <!-- Cohort 6: 0-14 years (1970: Male 14.5%, Female 14.0%) -->
    <rect x="35" y="280" width="145" height="32" rx="2" fill="#06b6d4" />
    <rect x="180" y="280" width="140" height="32" rx="2" fill="#c084fc" />
    <text x="180" y="301" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">0–14 yrs</text>
    <text x="10" y="300" fill="#38bdf8" font-size="10">14.5%</text>
    <text x="328" y="300" fill="#e9d5ff" font-size="10">14.0%</text>
  </g>

  <!-- ==================== RIGHT PYRAMID: 2024 ==================== -->
  <g transform="translate(440, 110)">
    <!-- Subheading -->
    <rect x="0" y="0" width="360" height="28" rx="4" fill="rgba(192, 132, 252, 0.15)" stroke="rgba(192, 132, 252, 0.3)" />
    <text x="180" y="19" text-anchor="middle" fill="#c084fc" font-size="14" font-weight="700">Year 2024 (Total Population: 58.2M)</text>

    <!-- Center Line & Gridlines -->
    <line x1="180" y1="40" x2="180" y2="340" stroke="#475569" stroke-width="2" />
    <g stroke="#334155" stroke-dasharray="3,3" stroke-width="1">
      <line x1="30" y1="40" x2="30" y2="340" />
      <line x1="80" y1="40" x2="80" y2="340" />
      <line x1="130" y1="40" x2="130" y2="340" />
      <line x1="230" y1="40" x2="230" y2="340" />
      <line x1="280" y1="40" x2="280" y2="340" />
      <line x1="330" y1="40" x2="330" y2="340" />
    </g>

    <!-- X-Axis Labels (Percentages) -->
    <g fill="#94a3b8" font-size="10" text-anchor="middle">
      <text x="30" y="356">15%</text>
      <text x="80" y="356">10%</text>
      <text x="130" y="356">5%</text>
      <text x="180" y="356">0%</text>
      <text x="230" y="356">5%</text>
      <text x="280" y="356">10%</text>
      <text x="330" y="356">15%</text>
      <text x="180" y="372" fill="#cbd5e1" font-weight="600">Male ◄ | ► Female</text>
    </g>

    <!-- Cohort 1: 75+ years (2024: Male 4.5%, Female 6.5%) -->
    <rect x="135" y="55" width="45" height="32" rx="2" fill="#06b6d4" />
    <rect x="180" y="55" width="65" height="32" rx="2" fill="#c084fc" />
    <text x="180" y="76" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">75+ yrs</text>
    <text x="115" y="75" fill="#38bdf8" font-size="10">4.5%</text>
    <text x="252" y="75" fill="#e9d5ff" font-size="10">6.5%</text>

    <!-- Cohort 2: 60-74 years (2024: Male 9.5%, Female 10.5%) -->
    <rect x="85" y="100" width="95" height="32" rx="2" fill="#06b6d4" />
    <rect x="180" y="100" width="105" height="32" rx="2" fill="#c084fc" />
    <text x="180" y="121" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">60–74</text>
    <text x="65" y="120" fill="#38bdf8" font-size="10">9.5%</text>
    <text x="294" y="120" fill="#e9d5ff" font-size="10">10.5%</text>

    <!-- Cohort 3: 45-59 years (2024: Male 11.5%, Female 11.5%) -->
    <rect x="65" y="145" width="115" height="32" rx="2" fill="#06b6d4" />
    <rect x="180" y="145" width="115" height="32" rx="2" fill="#c084fc" />
    <text x="180" y="166" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">45–59</text>
    <text x="45" y="165" fill="#38bdf8" font-size="10">11.5%</text>
    <text x="303" y="165" fill="#e9d5ff" font-size="10">11.5%</text>

    <!-- Cohort 4: 30-44 years (2024: Male 10.0%, Female 10.0%) -->
    <rect x="80" y="190" width="100" height="32" rx="2" fill="#06b6d4" />
    <rect x="180" y="190" width="100" height="32" rx="2" fill="#c084fc" />
    <text x="180" y="211" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">30–44</text>
    <text x="60" y="210" fill="#38bdf8" font-size="10">10.0%</text>
    <text x="288" y="210" fill="#e9d5ff" font-size="10">10.0%</text>

    <!-- Cohort 5: 15-29 years (2024: Male 8.5%, Female 8.0%) -->
    <rect x="95" y="235" width="85" height="32" rx="2" fill="#06b6d4" />
    <rect x="180" y="235" width="80" height="32" rx="2" fill="#c084fc" />
    <text x="180" y="256" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">15–29</text>
    <text x="75" y="255" fill="#38bdf8" font-size="10">8.5%</text>
    <text x="268" y="255" fill="#e9d5ff" font-size="10">8.0%</text>

    <!-- Cohort 6: 0-14 years (2024: Male 5.0%, Female 4.5%) -->
    <rect x="130" y="280" width="50" height="32" rx="2" fill="#06b6d4" />
    <rect x="180" y="280" width="45" height="32" rx="2" fill="#c084fc" />
    <text x="180" y="301" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">0–14 yrs</text>
    <text x="108" y="300" fill="#38bdf8" font-size="10">5.0%</text>
    <text x="232" y="300" fill="#e9d5ff" font-size="10">4.5%</text>
  </g>

  <!-- Summary Feature Annotations at the bottom -->
  <g transform="translate(40, 480)">
    <rect x="0" y="0" width="760" height="28" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="380" y="18" fill="#94a3b8" font-size="11" text-anchor="middle">
      <tspan fill="#38bdf8" font-weight="600">Key Feature:</tspan> Youth base (0–14 yrs) contracted from 28.5% in 1970 to 9.5% in 2024, while senior population (60+ yrs) more than doubled from 14.5% to 31.0%.
    </text>
  </g>
</svg>

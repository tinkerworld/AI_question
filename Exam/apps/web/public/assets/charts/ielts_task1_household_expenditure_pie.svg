<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Title & Subtitle -->
  <text x="400" y="36" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Comparative Household Expenditure Distribution in Country X (1975 vs 2025)</text>
  <text x="400" y="58" text-anchor="middle" fill="#94a3b8" font-size="13">Proportions of average weekly household expenditure by spending category (%)</text>

  <!-- Legend at Bottom -->
  <g transform="translate(60, 420)">
    <!-- Food -->
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#3b82f6" />
    <text x="20" y="12" fill="#e2e8f0" font-size="11">Food &amp; Groceries</text>

    <!-- Housing -->
    <rect x="140" y="0" width="14" height="14" rx="3" fill="#ec4899" />
    <text x="160" y="12" fill="#e2e8f0" font-size="11">Housing &amp; Energy</text>

    <!-- Transport -->
    <rect x="280" y="0" width="14" height="14" rx="3" fill="#10b981" />
    <text x="300" y="12" fill="#e2e8f0" font-size="11">Transport &amp; Fuel</text>

    <!-- Tech -->
    <rect x="420" y="0" width="14" height="14" rx="3" fill="#8b5cf6" />
    <text x="440" y="12" fill="#e2e8f0" font-size="11">Tech &amp; Telecom</text>

    <!-- Leisure -->
    <rect x="550" y="0" width="14" height="14" rx="3" fill="#f59e0b" />
    <text x="570" y="12" fill="#e2e8f0" font-size="11">Leisure</text>

    <!-- Clothing -->
    <rect x="635" y="0" width="14" height="14" rx="3" fill="#06b6d4" />
    <text x="655" y="12" fill="#e2e8f0" font-size="11">Clothing</text>
  </g>

  <!-- 1975 Chart Heading -->
  <text x="240" y="98" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="700">1975</text>
  <text x="240" y="116" text-anchor="middle" fill="#94a3b8" font-size="11">Total Weekly Budget: £64</text>

  <!-- 1975 Pie Group -->
  <g id="pie-1975">
    <!-- Food (35%) -->
    <path d="M 240.0 240.0 L 240.0 125.0 A 115 115 0 0 1 333.0 307.6 Z" fill="#3b82f6" stroke="#0f172a" stroke-width="2" />
    <text x="306.6" y="206.1" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">35%</text>

    <!-- Housing (22%) -->
    <path d="M 240.0 240.0 L 333.0 307.6 A 115 115 0 0 1 191.0 344.1 Z" fill="#ec4899" stroke="#0f172a" stroke-width="2" />
    <text x="258.6" y="312.4" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">22%</text>

    <!-- Clothing (15%) -->
    <path d="M 240.0 240.0 L 191.0 344.1 A 115 115 0 0 1 127.0 261.5 Z" fill="#06b6d4" stroke="#0f172a" stroke-width="2" />
    <text x="180.9" y="285.8" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">15%</text>

    <!-- Transport (14%) -->
    <path d="M 240.0 240.0 L 127.0 261.5 A 115 115 0 0 1 151.4 166.7 Z" fill="#10b981" stroke="#0f172a" stroke-width="2" />
    <text x="167.6" y="221.4" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">14%</text>

    <!-- Leisure (12%) -->
    <path d="M 240.0 240.0 L 151.4 166.7 A 115 115 0 0 1 225.6 125.9 Z" fill="#f59e0b" stroke="#0f172a" stroke-width="2" />
    <text x="204.0" y="174.5" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">12%</text>

    <!-- Tech (2%) -->
    <path d="M 240.0 240.0 L 225.6 125.9 A 115 115 0 0 1 240.0 125.0 Z" fill="#8b5cf6" stroke="#0f172a" stroke-width="2" />
    <!-- 2% callout line outside pie -->
    <line x1="233" y1="125" x2="210" y2="108" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="204" y="106" fill="#c084fc" font-size="11" font-weight="700" text-anchor="end">2% Tech</text>
  </g>

  <!-- 2025 Chart Heading -->
  <text x="560" y="98" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="700">2025</text>
  <text x="560" y="116" text-anchor="middle" fill="#94a3b8" font-size="11">Total Weekly Budget: £540</text>

  <!-- 2025 Pie Group -->
  <g id="pie-2025">
    <!-- Housing (34%) -->
    <path d="M 560.0 240.0 L 560.0 125.0 A 115 115 0 0 1 657.1 301.6 Z" fill="#ec4899" stroke="#0f172a" stroke-width="2" />
    <text x="625.5" y="204.0" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">34%</text>

    <!-- Transport (18%) -->
    <path d="M 560.0 240.0 L 657.1 301.6 A 115 115 0 0 1 545.6 354.1 Z" fill="#10b981" stroke="#0f172a" stroke-width="2" />
    <text x="591.8" y="307.6" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">18%</text>

    <!-- Tech (16%) -->
    <path d="M 560.0 240.0 L 545.6 354.1 A 115 115 0 0 1 455.9 289.0 Z" fill="#8b5cf6" stroke="#0f172a" stroke-width="2" />
    <text x="516.1" y="300.5" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">16%</text>

    <!-- Food (15%) -->
    <path d="M 560.0 240.0 L 455.9 289.0 A 115 115 0 0 1 459.2 184.6 Z" fill="#3b82f6" stroke="#0f172a" stroke-width="2" />
    <text x="485.3" y="237.7" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">15%</text>

    <!-- Leisure (12%) -->
    <path d="M 560.0 240.0 L 459.2 184.6 A 115 115 0 0 1 524.5 130.6 Z" fill="#f59e0b" stroke="#0f172a" stroke-width="2" />
    <text x="512.4" y="182.4" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">12%</text>

    <!-- Clothing (5%) -->
    <path d="M 560.0 240.0 L 524.5 130.6 A 115 115 0 0 1 560.0 125.0 Z" fill="#06b6d4" stroke="#0f172a" stroke-width="2" />
    <!-- 5% callout line outside pie -->
    <line x1="544" y1="126" x2="520" y2="108" stroke="#06b6d4" stroke-width="1.5" />
    <text x="514" y="106" fill="#22d3ee" font-size="11" font-weight="700" text-anchor="end">5% Clothing</text>
  </g>
</svg>

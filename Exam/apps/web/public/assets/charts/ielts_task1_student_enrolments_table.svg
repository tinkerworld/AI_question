<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Header: Title and Subtitle -->
  <text x="400" y="34" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">International Student Enrolments Across Six Major Universities (2015 vs 2025)</text>
  <text x="400" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">Comparative figures showing total headcounts, net student increase, and proportional growth rate (%)</text>

  <!-- Table Container Card -->
  <rect x="35" y="75" width="730" height="340" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

  <!-- Table Header Row -->
  <rect x="35" y="75" width="730" height="42" rx="8" fill="#0f172a" />
  <line x1="35" y1="117" x2="765" y2="117" stroke="#334155" stroke-width="1.5" />

  <!-- Column Headers -->
  <g fill="#38bdf8" font-size="12" font-weight="700">
    <text x="55" y="101" text-anchor="start">University / Institution</text>
    <text x="350" y="101" text-anchor="end">2015 Enrolment</text>
    <text x="470" y="101" text-anchor="end">2025 Enrolment</text>
    <text x="600" y="101" text-anchor="end">Net Increase</text>
    <text x="735" y="101" text-anchor="end">% Growth</text>
  </g>

  <!-- Row 1: University of Oxford -->
  <rect x="35" y="117" width="730" height="36" fill="#1e293b" />
  <line x1="35" y1="153" x2="765" y2="153" stroke="#334155" stroke-width="0.8" />
  <text x="55" y="140" fill="#f1f5f9" font-size="12" font-weight="500">University of Oxford (UK)</text>
  <text x="350" y="140" fill="#cbd5e1" font-size="12" text-anchor="end">8,400</text>
  <text x="470" y="140" fill="#cbd5e1" font-size="12" text-anchor="end">12,600</text>
  <text x="600" y="140" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="end">+4,200</text>
  <text x="735" y="140" fill="#10b981" font-size="12" font-weight="700" text-anchor="end">+50.0%</text>

  <!-- Row 2: University of Cambridge -->
  <rect x="35" y="153" width="730" height="36" fill="#172033" />
  <line x1="35" y1="189" x2="765" y2="189" stroke="#334155" stroke-width="0.8" />
  <text x="55" y="176" fill="#f1f5f9" font-size="12" font-weight="500">University of Cambridge (UK)</text>
  <text x="350" y="176" fill="#cbd5e1" font-size="12" text-anchor="end">7,500</text>
  <text x="470" y="176" fill="#cbd5e1" font-size="12" text-anchor="end">11,100</text>
  <text x="600" y="176" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="end">+3,600</text>
  <text x="735" y="176" fill="#10b981" font-size="12" font-weight="700" text-anchor="end">+48.0%</text>

  <!-- Row 3: University of Melbourne -->
  <rect x="35" y="189" width="730" height="36" fill="#1e293b" />
  <line x1="35" y1="225" x2="765" y2="225" stroke="#334155" stroke-width="0.8" />
  <text x="55" y="212" fill="#f1f5f9" font-size="12" font-weight="500">University of Melbourne (Australia)</text>
  <text x="350" y="212" fill="#cbd5e1" font-size="12" text-anchor="end">14,200</text>
  <text x="470" y="212" fill="#cbd5e1" font-size="12" text-anchor="end">22,700</text>
  <text x="600" y="212" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="end">+8,500</text>
  <text x="735" y="212" fill="#10b981" font-size="12" font-weight="700" text-anchor="end">+59.9%</text>

  <!-- Row 4: University of Toronto (Highest Growth & Highest Enrolment) -->
  <rect x="35" y="225" width="730" height="36" fill="#172033" />
  <line x1="35" y1="261" x2="765" y2="261" stroke="#334155" stroke-width="0.8" />
  <text x="55" y="248" fill="#f1f5f9" font-size="12" font-weight="600">University of Toronto (Canada)</text>
  <text x="350" y="248" fill="#cbd5e1" font-size="12" text-anchor="end">15,800</text>
  <text x="470" y="248" fill="#cbd5e1" font-size="12" text-anchor="end">27,400</text>
  <text x="600" y="248" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="end">+11,600</text>
  <text x="735" y="248" fill="#10b981" font-size="12" font-weight="700" text-anchor="end">+73.4%</text>

  <!-- Row 5: National University of Singapore -->
  <rect x="35" y="261" width="730" height="36" fill="#1e293b" />
  <line x1="35" y1="297" x2="765" y2="297" stroke="#334155" stroke-width="0.8" />
  <text x="55" y="284" fill="#f1f5f9" font-size="12" font-weight="500">National University of Singapore (Singapore)</text>
  <text x="350" y="284" fill="#cbd5e1" font-size="12" text-anchor="end">8,900</text>
  <text x="470" y="284" fill="#cbd5e1" font-size="12" text-anchor="end">10,800</text>
  <text x="600" y="284" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="end">+1,900</text>
  <text x="735" y="284" fill="#f59e0b" font-size="12" font-weight="700" text-anchor="end">+21.3%</text>

  <!-- Row 6: Imperial College London -->
  <rect x="35" y="297" width="730" height="36" fill="#172033" />
  <line x1="35" y1="333" x2="765" y2="333" stroke="#334155" stroke-width="1.2" />
  <text x="55" y="320" fill="#f1f5f9" font-size="12" font-weight="500">Imperial College London (UK)</text>
  <text x="350" y="320" fill="#cbd5e1" font-size="12" text-anchor="end">9,100</text>
  <text x="470" y="320" fill="#cbd5e1" font-size="12" text-anchor="end">13,200</text>
  <text x="600" y="320" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="end">+4,100</text>
  <text x="735" y="320" fill="#10b981" font-size="12" font-weight="700" text-anchor="end">+45.1%</text>

  <!-- Summary Row: Total Enrolments -->
  <rect x="35" y="333" width="730" height="42" fill="#0f172a" />
  <text x="55" y="359" fill="#f8fafc" font-size="13" font-weight="700">Total Across Six Universities</text>
  <text x="350" y="359" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="end">63,900</text>
  <text x="470" y="359" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="end">97,800</text>
  <text x="600" y="359" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="end">+33,900</text>
  <text x="735" y="359" fill="#10b981" font-size="13" font-weight="700" text-anchor="end">+53.1%</text>

  <!-- Bottom Key Insights Note -->
  <g transform="translate(35, 428)">
    <rect x="0" y="0" width="730" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="20" r="6" fill="#06b6d4" />
    <text x="30" y="16" fill="#38bdf8" font-size="11" font-weight="700">Examiner Synthesis Summary:</text>
    <text x="30" y="31" fill="#94a3b8" font-size="11">Overall international enrolments expanded by 53.1%. Toronto led both in total volume (27,400) and rate of growth (+73.4%), whereas NUS registered the lowest expansion (+21.3%).</text>
  </g>
</svg>
